<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 12 – Nhóm 4 Lớp 12 Anh</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #FFF4B7;
    margin: 0;
}
header {
    background: linear-gradient(135deg, #000B58, #003161);
    color: white;
    text-align: center;
    padding: 40px 20px;
}
h1 {margin: 0; font-size: 36px;}
h2 {color: #000B58;}
section {background: white; margin: 20px auto; width: 90%; max-width: 900px; padding: 20px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.15);} 
.details {display: none; margin-top: 15px;}
button {background: #006A67; color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer;}
button:hover {background: #003161;}
fieldset {margin-bottom: 15px; border-radius: 8px;}

/* Thêm font đẹp */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
body { font-family: 'Poppins', sans-serif; }

/* Nền thêm họa tiết nhẹ */
body {
    background: #FFF4B7 url('https://www.transparenttextures.com/patterns/cubes.png');
}

/* Header thêm logo + đổ bóng */
header img.logo {
    width: 110px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
    margin-bottom: 12px;
}

/* Nút mượt hơn */
button {
    transition: 0.3s;
    font-weight: 600;
}
button:hover {
    transform: scale(1.05);
}

/* Section hiệu ứng nổi */
section {
    transition: 0.3s;
}
section:hover {
    transform: translateY(-5px);
}

/* Iframe bo góc */
iframe {
    border-radius: 12px;
    border: 2px solid #003161;
}


/* MENU CHUYÊN NGHIỆP */
nav.topmenu {
    width:100%;
    background:#003161cc;
    backdrop-filter: blur(4px);
    position:fixed;
    top:0;
    left:0;
    padding:12px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:100;
}
nav.topmenu a {
    color:white;
    text-decoration:none;
    font-weight:600;
    margin-right:18px;
    transition:.25s;
}
nav.topmenu a:hover {
    color:#FFD93D;
    transform: translateY(-2px);
}
/* Đồng bộ toàn bộ font chữ */
* {
    font-family: 'Poppins', sans-serif !important;
}
</style>
<script>
function toggle(id){
  var x=document.getElementById(id);
  x.style.display = x.style.display==="block" ? "none" : "block";
}

// Hiệu ứng mở section mượt hơn
function toggle(id){
  var box=document.getElementById(id);
  if(box.style.display==="block"){
     box.style.opacity=0;
     setTimeout(()=>{ box.style.display="none"; },200);
  } else {
     box.style.display="block";
     setTimeout(()=>{ box.style.opacity=1; },10);
  }
}

// Hiệu ứng cuộn mượt + nảy (bounce)
function bounceScroll(targetID){
    const el = document.getElementById(targetID);
    if (!el) return;

    el.scrollIntoView({ behavior: 'smooth', block: 'start' });

    setTimeout(() => {
        el.style.transition = 'transform 0.45s cubic-bezier(0.30, 2.0, 0.45, 1), box-shadow 0.45s ease';
        el.style.transform = 'scale(1.18)';
        el.style.boxShadow = '0 0 45px #ffe47a, 0 0 75px #FFD93D';

        setTimeout(() => {
            el.style.transform = 'scale(1.06)';
            el.style.boxShadow = '0 0 25px #FFD93D';

            setTimeout(() => {
                el.style.transform = 'scale(1)';
                el.style.boxShadow = '0 0 0 transparent';
            }, 220);
        }, 420);
    }, 500);
});

    // Hiệu ứng zoom + bounce mạnh + glow
    setTimeout(()=>{
        el.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease';

        // Zoom lớn + glow
        el.style.transform = 'scale(1.08)';
        el.style.boxShadow = '0 0 25px #FFD93D';

        setTimeout(()=>{
            // Thu lại bình thường nhưng vẫn nhẹ nhàng
            el.style.transform = 'scale(1)';
            el.style.boxShadow = '0 0 0px transparent';
        }, 350);
    }, 500);
}
</style>

<script>
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
</script>

</body>
</html>
